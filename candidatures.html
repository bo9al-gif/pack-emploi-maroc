<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pack Emploi Maroc — Suivi des candidatures</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#172033}.wrap{max-width:1000px;margin:auto;padding:22px}.card{background:white;padding:18px;border-radius:12px;margin:12px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}input,select,button{padding:10px;border:1px solid #ccd3dd;border-radius:7px}button{background:#1769aa;color:white;font-weight:bold;cursor:pointer}.row{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:7px;margin-top:8px}@media(max-width:750px){.grid,.row{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}</style></head><body><div class="wrap"><h1>Suivi des candidatures</h1><p>Suivez vos candidatures directement dans votre navigateur. Les données restent sur cet appareil.</p><div class="card"><div class="row"><input id="company" placeholder="Entreprise"><input id="post" placeholder="Poste"><input id="date" type="date"><select id="status"><option>À envoyer</option><option>Envoyée</option><option>Entretien</option><option>Refus</option><option>Acceptée</option></select><button onclick="add()">Ajouter</button></div></div><div class="card"><div class="grid"><strong>Total: <span id="total">0</span></strong><strong>Envoyées: <span id="sent">0</span></strong><strong>Entretiens: <span id="interview">0</span></strong><strong>Acceptées: <span id="accepted">0</span></strong></div><table><thead><tr><th>Entreprise</th><th>Poste</th><th>Date</th><th>Statut</th><th></th></tr></thead><tbody id="body"></tbody></table></div></div><script>let data=JSON.parse(localStorage.getItem('pem-candidatures')||'[]');function save(){localStorage.setItem('pem-candidatures',JSON.stringify(data));render()}function add(){const company=document.getElementById('company').value.trim(),post=document.getElementById('post').value.trim();if(!company||!post)return alert('Entreprise et poste requis.');data.push({company,post,date:document.getElementById('date').value,status:document.getElementById('status').value});document.getElementById('company').value='';document.getElementById('post').value='';save()}function del(i){data.splice(i,1);save()}function render(){body.innerHTML=data.map((x,i)=>'<tr><td>'+esc(x.company)+'</td><td>'+esc(x.post)+'</td><td>'+esc(x.date)+'</td><td>'+esc(x.status)+'</td><td><button onclick="del('+i+')">Supprimer</button></td></tr>').join('');total.textContent=data.length;sent.textContent=data.filter(x=>x.status==='Envoyée').length;interview.textContent=data.filter(x=>x.status==='Entretien').length;accepted.textContent=data.filter(x=>x.status==='Acceptée').length}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}render()</script></body></html>
