<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Maroc — أدوات مجانية</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#0f172a}.wrap{max-width:1000px;margin:auto;padding:22px}.head{background:#0b1220;color:white;padding:24px;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;margin-top:18px}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:18px}.card h2{margin-top:0}.row{display:flex;gap:8px}.row>*{flex:1}input,button{padding:11px;border-radius:10px;border:1px solid #cbd5e1;font:inherit}button{background:#0f766e;color:white;cursor:pointer}.out{margin-top:12px;background:#f8fafc;padding:12px;border-radius:12px;white-space:pre-wrap;max-height:280px;overflow:auto}.back{display:inline-block;margin-top:15px;color:#0f766e}</style></head><body><div class="wrap"><div class="head"><h1>🇲🇦 AI Maroc — أدوات مجانية</h1><p>خدمات إضافية بدون API keys: الطقس، الصرف، الكتب، فرص العمل والجيوكودينغ.</p></div><div class="grid"><div class="card"><h2>🌤️ الطقس</h2><div class="row"><input id="lat" value="34.0209"><input id="lon" value="-6.8416"></div><button onclick="weather()">شوف الطقس</button><div id="weather" class="out">—</div></div><div class="card"><h2>💱 صرف العملات</h2><div class="row"><input id="base" value="EUR" maxlength="3"><input id="quote" value="MAD,USD"></div><button onclick="rates()">جيب السعر</button><div id="rates" class="out">—</div></div><div class="card"><h2>📚 البحث فالكتب</h2><input id="book" placeholder="English grammar"><button onclick="books()">بحث</button><div id="books" class="out">—</div></div><div class="card"><h2>💼 فرص العمل</h2><input id="job" placeholder="developer"><button onclick="jobs()">بحث</button><div id="jobs" class="out">—</div></div><div class="card"><h2>📍 أماكن فالمغرب</h2><input id="geo" placeholder="Rabat"><button onclick="geo()">بحث</button><div id="geo" class="out">—</div></div></div><a class="back" href="/">← رجع لـ AI Maroc</a></div><script>async function call(type,params){const u=new URL('/api/public-tools',location.origin);u.searchParams.set('type',type);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u);return r.json()}function show(id,x){document.getElementById(id).textContent=JSON.stringify(x,null,2)}async function weather(){show('weather',await call('weather',{lat:lat.value,lon:lon.value}))}async function rates(){show('rates',await call('rates',{base:base.value,quote:quote.value}))}async function books(){show('books',await call('books',{q:book.value}))}async function jobs(){show('jobs',await call('jobs',{q:job.value}))}async function geo(){show('geo',await call('geocode',{q:geo.value}))}</script></body></html>
