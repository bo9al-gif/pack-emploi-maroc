<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.svg">
<title>AI Maroc — مساعدك اليومي 🇲🇦</title>
<meta name="description" content="AI Maroc: assistant pratique pour écrire, étudier, traduire, calculer et préparer ses démarches au Maroc.">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#101828;--muted:#667085;--primary:#111827;--accent:#0f766e;--line:#e4e7ec}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:42px 18px 30px;background:linear-gradient(135deg,#111827,#164e63);color:#fff;text-align:center}header .logo{font-size:44px}header h1{margin:8px 0;font-size:38px}header p{max-width:680px;margin:0 auto;color:#d1fae5;line-height:1.6}
.container{max-width:1050px;margin:auto;padding:24px 18px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.tool{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left;cursor:pointer;transition:.15s}.tool:hover{transform:translateY(-2px);box-shadow:0 8px 25px #10182812}.tool b{display:block;font-size:18px;margin:8px 0}.tool span{color:var(--muted);font-size:14px;line-height:1.5}
.panel{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}.row{display:flex;gap:10px;flex-wrap:wrap}textarea,input,select{width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:13px;font:inherit;background:#fff}textarea{min-height:150px;resize:vertical}.field{flex:1;min-width:200px}.btn{border:0;border-radius:12px;padding:12px 17px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#e8f5f2;color:#065f46}.result{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);padding:16px;border-radius:14px;line-height:1.65;margin-top:14px;min-height:55px}
footer{text-align:center;color:var(--muted);padding:30px 18px;font-size:13px}@media(max-width:760px){.tools{grid-template-columns:1fr 1fr}header h1{font-size:30px}}@media(max-width:480px){.tools{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">🇲🇦</div><h1>AI Maroc</h1><p>مساعدك اليومي: كتب، ترجم، قرا، حسب، وجد طلباتك — بالعربية، الدارجة والفرنسية.</p></header>
<main class="container">
<div class="tools">
<button class="tool" onclick="openTool('write')">✍️<b>كاتب ذكي</b><span>رسائل واتساب، إيميلات، طلبات عمل ورسائل إدارية.</span></button>
<button class="tool" onclick="openTool('study')">📚<b>مساعد الدراسة</b><span>شرح درس أو تمرين وصناعة أسئلة للمراجعة.</span></button>
<button class="tool" onclick="openTool('translate')">🌍<b>ترجمة</b><span>العربية، الدارجة، الفرنسية والإنجليزية.</span></button>
<button class="tool" onclick="openTool('calculate')">🧮<b>حاسبات</b><span>نسبة مئوية، تقسيم مصاريف وتحويلات بسيطة.</span></button>
<button class="tool" onclick="openTool('job')">💼<b>طلبات العمل</b><span>صيغ جاهزة للتقديم على وظيفة عبر WhatsApp أو email.</span></button>
<button class="tool" onclick="openTool('admin')">📄<b>إداري</b><span>طلب، شكاية، تصريح أو مراسلة بصياغة منظمة.</span></button>
</div>
<section class="panel" id="panel">
<h2>اختار أداة 👆</h2><p style="color:var(--muted)">النسخة الأولى جاهزة بواجهة خفيفة للهاتف. كتجرب محركات AI المجانية تلقائياً، وإذا توفر مفتاح مدفوع/مجاني كتستعملو كأولوية.</p>
</section>
</main><footer>AI Maroc 🇲🇦 — نسخة أولية قابلة للتطوير إلى تطبيق وربح من Premium.</footer>
<script>
const panel=document.getElementById('panel');
const configs={
write:['✍️ كاتب ذكي','شنو بغيتي تكتب؟', 'مثال: بغيت نرسل رسالة محترمة لشركة باش نسول على خدمة.'],
study:['📚 مساعد الدراسة','كتب الدرس أو التمرين هنا','مثال: شرح لي هاد الفقرة بطريقة بسيطة.'],
translate:['🌍 ترجمة','النص المراد ترجمته','مثال: Je cherche un emploi.'],
job:['💼 طلب عمل','شنو الخدمة والمدينة؟','مثال: مساعد إداري في الرباط.'],
admin:['📄 مراسلة إدارية','شنو نوع الطلب؟','مثال: طلب شهادة إدارية.']
};
function openTool(type){
 if(type==='calculate'){panel.innerHTML='<h2>🧮 حاسبات</h2><div class="row"><div class="field"><label>المبلغ</label><input id="amount" type="number" placeholder="100"></div><div class="field"><label>النسبة %</label><input id="pct" type="number" placeholder="20"></div></div><button class="btn" onclick="calc()">احسب</button><div class="result" id="res">النتيجة غادي تبان هنا.</div>';return}
 const c=configs[type];panel.innerHTML='<h2>'+c[0]+'</h2><textarea id="prompt" placeholder="'+c[2]+'"></textarea><div class="row" style="margin-top:10px"><select id="lang" class="field"><option>الدارجة المغربية</option><option>العربية</option><option>Français</option><option>English</option></select><button class="btn" onclick="askAI()">توليد ✨</button></div><div class="result" id="res">الجواب غادي يبان هنا.</div>';
}
function calc(){let a=+document.getElementById('amount').value||0,p=+document.getElementById('pct').value||0;document.getElementById('res').textContent='النسبة: '+(a*p/100).toFixed(2)+'\nالمجموع مع النسبة: '+(a+a*p/100).toFixed(2)+'\nالمبلغ بعد خصم النسبة: '+(a-a*p/100).toFixed(2)}
async function askAI(){const p=document.getElementById('prompt').value.trim(),lang=document.getElementById('lang').value,res=document.getElementById('res');if(!p){res.textContent='كتب الطلب ديالك الأول.';return}res.textContent='كنوجد الجواب...';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,language:lang})});const d=await r.json();res.textContent=d.answer||d.error||'وقع مشكل.'}catch(e){res.textContent='ما جاوبش محرك AI دابا. عاود المحاولة بعد شوية.'}}
</script>
</body></html>
